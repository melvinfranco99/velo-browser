<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; form-action https:">
<title>Velo</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: #14121c; color: #e7e3f2; font: 16px/1.5 system-ui, sans-serif; }
  main { width: min(640px, calc(100% - 32px)); text-align: center; }
  h1 { font-weight: 300; font-size: 44px; letter-spacing: 6px; margin: 0 0 8px; }
  .status { display: inline-block; padding: 6px 14px; border-radius: 999px; font-size: 14px; margin-bottom: 28px; }
  .tor { background: #1f3b2b; color: #8ee6a8; }
  .notor { background: #4a1f24; color: #ff9aa5; }
  form { display: flex; gap: 8px; flex-wrap: wrap; }
  input { flex: 1; padding: 14px 18px; border-radius: 12px; border: 1px solid #3a3550;
          background: #1d1a28; color: inherit; font-size: 16px; outline: none; }
  input:focus { border-color: #8b7fd1; }
  button { padding: 0 22px; border: 0; border-radius: 12px; background: #6f5fc7; color: white; font-size: 16px; cursor: pointer; }
  ul { text-align: left; color: #a9a3bd; font-size: 14px; margin-top: 32px; padding-left: 20px; }
  li { margin: 4px 0; }
  kbd { background: #2a2638; border-radius: 4px; padding: 1px 6px; font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>VELO</h1>
  <div class="status tor">Conectado a través de Tor</div>
  <form action="https://duckduckgo.com/" method="get">
    <input name="q" placeholder="Buscar con DuckDuckGo o escribir una dirección" autofocus autocomplete="off">
    <button type="submit">Buscar</button>
  </form>
  <ul>
    <li>Todo en RAM: historial, cookies y caché desaparecen al cerrar Velo.</li>
    <li>Más de 70.000 dominios de rastreo y publicidad bloqueados.</li>
    <li>Menú ⋮ → <b>Nueva identidad</b> para borrarlo todo y cambiar de IP.</li>
    <li>Para máximo anonimato, no inicies sesión en cuentas personales.</li>
  </ul>
</main>
</body>
</html>
